version: "3.8"

services:
  ovms-llm:
    image: openvino/model_server:latest
    container_name: ovms-llm
    user: "0:0"
    privileged: true
    deploy:
      resources:
        limits:
          cpus: '12.0'
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - ./docker/models:/models:rw
      - ./configs/ovms_config.json:/config/ovms_config.json:ro
    environment:
      HF_TOKEN: HF_TOKEN: ${HF_TOKEN}
    command:
      - --model_repository_path
      - /models
      - --source_model
      - OpenVINO/Qwen3-14b-int8-ov
      - --model_name
      - qwen3-14b-int8-ov
      - --task
      - text_generation
      - --target_device
      - CPU
      - --port
      - "9000"
      - --rest_port
      - "8000"
      - --tool_parser
      - hermes3
    networks:
      - ovms-net
    restart: unless-stopped

  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands
    depends_on:
      - ovms-llm
    ports:
      - "3000:3000"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      LLM_BASE_URL: http://ovms-llm:8000/v3
      LLM_MODEL: openai/qwen3-14b-int8-ov
      LLM_API_KEY: unused
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_OUTPUT_TOKENS: "500"   # <--- The Generation Circuit Breaker
      LLM_MAX_INPUT_TOKENS: "4096"
      LLM_TIMEOUT: "4000"
      LITELLM_LOG: DEBUG
      SANDBOX_DOCKER_ARGS: --memory=1536m --memory-swap=1536m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.openhands-ovms:/.openhands
    networks:
      - ovms-net
    restart: unless-stopped

networks:
  ovms-net:
    name: ovms-net
    driver: bridge
    
